[package]
name = "terraria_fishing_bot"
version = "0.10.3"
edition = "2024"

[dependencies]
cpal = "0.18.1"
device_query = "4.0.1"
eframe = "0.35.0"
egui_extras = { version = "0.35.0", features = ["all_loaders"] }
enigo = "0.6.1"
image = "0.25.10"
log = "0.4.33"
ndarray = "0.17.2"
oar-ocr = "0.8.0"
ort = { version = "2.0.0-rc.12", features = [ "ndarray" ] }
regex = "1.13.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
strum_macros = "0.28.0"
xcap = "0.9.7"
